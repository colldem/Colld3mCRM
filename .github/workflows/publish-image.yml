# Kubernetes pulls the image from a registry; the NAS builds its own locally and
# never needs one. Tagging a release therefore also publishes to GHCR.
name: Publish image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.repository == 'colldem/Colld3mCRM'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Check the tag matches VERSION
        run: |
          test "$(cat VERSION)" = "${{ steps.version.outputs.value }}" \
            || { echo "VERSION is $(cat VERSION) but the tag says ${{ steps.version.outputs.value }}"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/crm-web:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/crm-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
