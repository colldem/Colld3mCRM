name: Deploy

# Deploys on a version tag (v1.2.3) after CI-equivalent checks pass, and only
# once the "production" environment approval is granted. Also runnable by hand
# (workflow_dispatch) for a redeploy or rollback to any ref.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch or SHA to deploy"
        required: true
        default: "main"

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ./scripts/release-check.sh
        env:
          PYTHON_BIN: python

  deploy:
    needs: verify
    runs-on: [self-hosted, crm-nas]
    environment:
      name: production
      url: https://crm.tailb8493f.ts.net/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Deploy to the NAS
        run: sh scripts/deploy.sh
