name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Release checks (migrations, tests, deploy check)
        env:
          PYTHON_BIN: python
        run: ./scripts/release-check.sh

  # Production runs PostgreSQL; the checks job above uses SQLite. Same suite, real engine.
  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
        env:
          POSTGRES_DB: crm
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm -d crm" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_HOST: localhost
      DB_NAME: crm
      DB_USER: crm
      DB_PASSWORD: crm-ci-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Migrations and tests on PostgreSQL
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py test

  # A disaster drill on every change: back up encrypted, lose everything, restore.
  backup-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure a throwaway instance
        run: |
          cat > .env <<'ENV'
          POSTGRES_PASSWORD=ci-only-db-password-0123456789
          DJANGO_SECRET_KEY=ci-only-secret-0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJ
          CRM_SETUP_TOKEN=ci-only-setup-token
          CRM_SECRETS_KEY=
          DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
          ENV
          mkdir -p runtime/backups runtime/media runtime/backup-config
      - name: Build and start
        run: |
          docker compose build
          docker compose up -d crm-db crm-web
          for i in $(seq 1 60); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q crm-web)")" = healthy ] && break
            sleep 3
          done
          docker compose ps
      - name: Create data, including an uploaded file
        run: |
          docker compose exec -T crm-web python manage.py shell -v 0 -c "
          from django.contrib.auth import get_user_model
          from django.core.files.base import ContentFile
          from contacts.models import Activity, Attachment, Person
          user = get_user_model().objects.create_user('drill', password='drill-password-123')
          person = Person.objects.create(first_name='Atkūrimo', last_name='Pratybos', created_by=user)
          activity = Activity.objects.create(person=person, text='prieš avariją', created_by=user)
          Attachment.objects.create(activity=activity, original_name='drill.txt', file=ContentFile(b'drill-file-content', name='drill.txt'))
          "
      - name: Encrypted backup with a key that never touches the backup host
        run: |
          docker compose run --rm --no-deps --entrypoint age-keygen crm-backup > /tmp/identity.txt
          recipient="$(grep -o 'age1[0-9a-z]*' /tmp/identity.txt | head -n 1)"
          docker compose run --rm -e BACKUP_ONCE=true -e BACKUP_AGE_RECIPIENTS="$recipient" \
            -e BACKUP_REQUIRE_ENCRYPTION=true crm-backup
          ls -l runtime/backups
          db="$(ls runtime/backups/db-*.dump.age)"; media="$(ls runtime/backups/media-*.tar.gz.age)"
          sudo head -c 32 "$db" | grep -q 'age-encryption.org' || { echo "dump is not encrypted"; exit 1; }
          ! sudo grep -a -q 'Pratybos' "$db" || { echo "plaintext found in the dump"; exit 1; }
          sudo test -f runtime/backups/last-success
          echo "DB=$db" >> "$GITHUB_ENV"; echo "MEDIA=$media" >> "$GITHUB_ENV"
      - name: Unencrypted backups are refused when encryption is required
        run: |
          ! docker compose run --rm -e BACKUP_ONCE=true -e BACKUP_REQUIRE_ENCRYPTION=true crm-backup
      - name: Disaster — database and uploads are gone
        run: |
          docker compose down
          sudo rm -rf runtime/postgres runtime/media
          mkdir -p runtime/media
          docker compose up -d crm-db
      - name: Tampered file is rejected
        run: |
          sudo cp "$DB" /tmp/pristine.age
          echo x | sudo tee -a "$DB" > /dev/null
          if bash scripts/restore.sh --db "$DB" --media "$MEDIA" --identity /tmp/identity.txt --yes > /tmp/tampered.log 2>&1; then
            echo "a tampered dump was restored"; exit 1
          fi
          grep -q "checksum mismatch" /tmp/tampered.log
          sudo cp /tmp/pristine.age "$DB"
      - name: Restore and prove the data is back
        run: |
          bash scripts/restore.sh --db "$DB" --media "$MEDIA" --identity /tmp/identity.txt --yes
          docker compose exec -T crm-web python manage.py shell -v 0 -c "
          from contacts.models import Attachment, AuditLog, Person
          person = Person.objects.get(last_name='Pratybos')
          attachment = Attachment.objects.get(activity__person=person)
          assert attachment.file.open('rb').read() == b'drill-file-content', 'attachment content differs'
          print('person, activity and file restored')
          "
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 100

  # The scanner integration against a real ClamAV, not only the protocol fake in the tests.
  clamav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Start ClamAV (the image compose.clamav.yaml pins)
        run: |
          image="$(grep -o 'clamav/clamav:[^ ]*' compose.clamav.yaml)"
          docker run -d --name clamav -p 3310:3310 "$image"
          for i in $(seq 1 120); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' clamav)" = healthy ] && break
            sleep 5
          done
          docker inspect --format '{{.State.Health.Status}}' clamav | grep -q healthy
      - name: EICAR is refused, a clean file accepted
        env:
          CRM_CLAMAV_HOST: 127.0.0.1
        run: |
          python manage.py migrate -v 0
          python manage.py shell -v 0 -c "
          from io import BytesIO
          from contacts.antivirus import check_upload, scan_file
          eicar = b'X5O!P%@AP[4\\\\PZX54(P^)7CC)7}\$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!\$H+H*'
          verdict = scan_file(BytesIO(eicar))
          print('eicar:', verdict)
          assert not verdict.clean and 'Eicar' in verdict.signature
          assert check_upload(BytesIO(b'%PDF-1.4 ordinary document'), name='ok.pdf', source='ci')
          assert not check_upload(BytesIO(eicar), name='eicar.txt', source='ci')
          print('real ClamAV verdicts OK')
          "

  # Oracle is not a supported target; this measures how far the code is from it
  # (docs/ORACLE.md). It never fails the build — the report is the output.
  oracle-compatibility:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: CiOracle0nly
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      DB_ENGINE: oracle
      DB_HOST: localhost
      DB_NAME: FREEPDB1
      DB_USER: system
      DB_PASSWORD: CiOracle0nly
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-oracle.txt
      - name: Migrations and the test suite on Oracle
        run: |
          set +e
          python manage.py test --noinput -v 2 > oracle-report.txt 2>&1
          status=$?
          grep -E "^(Ran|OK|FAILED)" oracle-report.txt
          grep -E "^(ERROR|FAIL):" oracle-report.txt | sort | uniq -c | sort -rn | head -60
          grep -hoE "(ORA-[0-9]{5}|DPY-[0-9]{4})[^\n]{0,90}" oracle-report.txt | sort | uniq -c | sort -rn | head -20
          exit $status
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: oracle-report
          path: oracle-report.txt

  # 50 concurrent users against the production image with default Gunicorn settings
  # and 5,000 contacts in PostgreSQL. Thresholds guard against regressions; the
  # numbers feed the sizing guidance in docs/DIEGIMAS-ORGANIZACIJOJE.md.
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Start the stack
        run: |
          docker build -t crm-web:load .
          docker network create load
          docker run -d --network load --name load-db -e POSTGRES_DB=crm -e POSTGRES_USER=crm -e POSTGRES_PASSWORD=load \
            "$(grep -m1 -o 'postgres:[^ "]*' compose.yaml)"
          for i in $(seq 1 30); do docker exec load-db pg_isready -U crm -d crm && break; sleep 2; done
          docker run -d --network load --name load-web -p 8080:8080 --cpus 2 --memory 1g \
            -e DB_HOST=load-db -e DB_PASSWORD=load -e CRM_ENVIRONMENT=load -e CRM_LOG_LEVEL=WARNING \
            -e DJANGO_SECRET_KEY=load-only-0123456789abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKLMN \
            -e DJANGO_ALLOWED_HOSTS='localhost,127.0.0.1' -e DJANGO_DEBUG=false crm-web:load
          for i in $(seq 1 40); do curl -fsS http://localhost:8080/health/ready && break; sleep 3; done
      - name: Seed 5,000 contacts
        run: docker exec -i load-web python manage.py shell -v 0 < scripts/loadtest/seed.py
      - name: Run 50 users for 3 minutes
        run: |
          python -m pip install -r scripts/loadtest/requirements.txt
          (while true; do docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}}' load-web load-db; sleep 15; done) > stats.txt &
          # Locust exits non-zero on any failed request; the threshold step decides.
          locust -f scripts/loadtest/locustfile.py --host http://localhost:8080 --headless -u 50 -r 5 -t 3m \
            --csv load --only-summary || true
          kill %1 || true
          cat stats.txt | tail -6
      - name: Check thresholds
        run: |
          python - <<'PY'
          import csv
          rows = {r["Name"]: r for r in csv.DictReader(open("load_stats.csv"))}
          total = rows["Aggregated"]
          requests, failures = int(total["Request Count"]), int(total["Failure Count"])
          p95 = float(total["95%"])
          print("requests=%d failures=%d p50=%sms p95=%sms rps=%s" % (requests, failures, total["50%"], total["95%"], total["Requests/s"]))
          for name, row in sorted(rows.items()):
              print("%-45s p50=%6s p95=%6s max=%8s n=%s" % (name, row["50%"], row["95%"], row["Max Response Time"], row["Request Count"]))
          assert requests > 1500, "too few requests"
          assert failures / requests < 0.01, "failure ratio above 1%"
          assert p95 < 2000, "95th percentile above 2 s"
          PY
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: load-test
          path: |
            load_*.csv
            stats.txt
      - name: Web logs on failure
        if: failure()
        run: docker logs load-web 2>&1 | tail -80

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install tools
        run: python -m pip install -r requirements-dev.txt
      - name: Dependency CVEs (pip-audit) and static analysis (bandit)
        env:
          PYTHON_BIN: python
        run: ./scripts/security-check.sh
      - name: Python SBOM (CycloneDX, runtime dependencies only)
        run: |
          python -m venv /tmp/runtime
          /tmp/runtime/bin/pip install -q -r requirements.txt
          cyclonedx-py environment /tmp/runtime/bin/python --of JSON -o sbom-python.cdx.json
      - uses: actions/upload-artifact@v5
        with:
          name: sbom-python
          path: sbom-python.cdx.json

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the production image
        run: docker build -t crm-web:ci .
      - name: Build the backup image
        run: docker build -f deploy/backup/Dockerfile -t crm-backup:ci .
      - name: Smoke test the image (migrate, collectstatic, health)
        run: |
          docker run -d --name crm-ci -p 8080:8080 \
            -e DJANGO_SECRET_KEY=ci-only-0123456789abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKLMN \
            -e DJANGO_ALLOWED_HOSTS='localhost,127.0.0.1' \
            -e DJANGO_DEBUG=false \
            crm-web:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/health/ready && break
            sleep 2
          done
          curl -fsS http://localhost:8080/health/ready
          docker rm -f crm-ci
      - name: Run it the way Kubernetes does (read-only root, /tmp and uploads writable, PostgreSQL)
        run: |
          docker network create ro
          docker run -d --network ro --name ro-db -e POSTGRES_DB=crm -e POSTGRES_USER=crm -e POSTGRES_PASSWORD=ci \
            "$(grep -m1 -o 'postgres:[^ "]*' compose.yaml)"
          for i in $(seq 1 30); do docker exec ro-db pg_isready -U crm -d crm && break; sleep 2; done
          docker run -d --network ro --name ro-web -p 8081:8080 --read-only --tmpfs /tmp --tmpfs /app/runtime/media:uid=10001 \
            -e DB_HOST=ro-db -e DB_PASSWORD=ci -e CRM_COLLECTSTATIC=0 \
            -e DJANGO_SECRET_KEY=ci-only-0123456789abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKLMN \
            -e DJANGO_ALLOWED_HOSTS='localhost,127.0.0.1' -e DJANGO_DEBUG=false crm-web:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8081/health/ready && break; sleep 2; done
          curl -fsS http://localhost:8081/health/ready
          curl -fsS -o /dev/null http://localhost:8081/login/
          docker logs ro-web 2>&1 | tail -5
          docker rm -f ro-web ro-db
      - name: Scan the image (Trivy — fixable HIGH/CRITICAL fail the build)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" \
            aquasec/trivy:0.57.1 image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 --no-progress crm-web:ci
      - name: Scan the backup image (Trivy — fixable HIGH/CRITICAL fail the build)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.57.1 image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 --no-progress --pkg-types os crm-backup:ci
      - name: Scan the bundled PostgreSQL image (report only — upstream, fixed by bumping its digest)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.57.1 image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --no-progress "$(grep -m1 -o 'postgres:[^ "]*' compose.yaml)"
      - name: Image SBOM (CycloneDX — OS packages and Python)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" \
            aquasec/trivy:0.57.1 image --format cyclonedx --output /out/sbom-image.cdx.json crm-web:ci
      - uses: actions/upload-artifact@v5
        with:
          name: sbom-image
          path: sbom-image.cdx.json

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Lint the chart
        run: helm lint deploy/helm/crm --set database.host=db.example.internal --set secrets.djangoSecretKey=x --set secrets.crmSecretsKey=y
      - name: Render the chart
        run: |
          helm template crm deploy/helm/crm \
            --set database.host=db.example.internal \
            --set secrets.djangoSecretKey=x \
            --set secrets.crmSecretsKey=y > /tmp/rendered.yaml
          # The web pods must never migrate, and the jobs must never overlap.
          grep -q 'name: CRM_RUN_MIGRATIONS' /tmp/rendered.yaml
          grep -q 'concurrencyPolicy: Forbid' /tmp/rendered.yaml
          grep -q 'helm.sh/hook: pre-install,pre-upgrade' /tmp/rendered.yaml
      - name: Render hardened options and validate against Kubernetes schemas
        run: |
          helm template crm deploy/helm/crm \
            --set database.host=db.example.internal \
            --set secrets.djangoSecretKey=x --set secrets.crmSecretsKey=y \
            --set networkPolicy.enabled=true \
            --set 'networkPolicy.egress[0].to[0].ipBlock.cidr=10.0.20.15/32' \
            --set 'networkPolicy.egress[0].ports[0].port=5432' > /tmp/hardened.yaml
          grep -q 'kind: NetworkPolicy' /tmp/hardened.yaml
          grep -q 'kind: PodDisruptionBudget' /tmp/hardened.yaml
          grep -q 'readOnlyRootFilesystem: true' /tmp/hardened.yaml
          grep -q 'automountServiceAccountToken: false' /tmp/hardened.yaml
          docker run --rm -v /tmp:/work ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -kubernetes-version 1.30.0 /work/rendered.yaml /work/hardened.yaml
