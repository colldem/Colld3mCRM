version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # Stay on the 5.2 LTS line (supported until 2028-04); 5.2.x security and
      # bugfix releases still come through.
      - dependency-name: django
        versions: [">=6.0"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: "/"
    schedule: { interval: weekly }
  # deploy/runner has no Dockerfile — its image is pinned in the NAS-only .env
  # (RUNNER_IMAGE), so Dependabot cannot see or bump it. Rotate it by hand
  # together with the PAT; see deploy/runner/README.md.
