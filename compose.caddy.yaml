# Overlay: serve the CRM over HTTPS on your own domain.
#
# Caddy obtains and renews a Let's Encrypt certificate on its own, so there is
# no certificate work to do. Enable it in .env:
#   COMPOSE_FILE=compose.yaml:compose.caddy.yaml
#   CRM_DOMAIN=crm.example.com         an A/AAAA record pointing at this host
#   CRM_ACME_EMAIL=admin@example.com   for expiry notices from Let's Encrypt
#   CRM_BASE_URL=https://crm.example.com
#   DJANGO_ALLOWED_HOSTS=crm.example.com
#   DJANGO_CSRF_TRUSTED_ORIGINS=https://crm.example.com
#   DJANGO_FORCE_HTTPS=true
#
# Ports 80 and 443 must be free and reachable from the internet: Let's Encrypt
# validates over port 80. If you already run a reverse proxy, do not use this
# overlay — point that proxy at the base file's port instead (docs/DEPLOYMENT.md).

services:
  crm-caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN:?Set CRM_DOMAIN in .env}
      CRM_ACME_EMAIL: ${CRM_ACME_EMAIL:?Set CRM_ACME_EMAIL in .env}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./runtime/caddy/data:/data
      - ./runtime/caddy/config:/config
    ports:
      - "${CRM_HTTP_BIND:-0.0.0.0}:80:80"
      - "${CRM_HTTP_BIND:-0.0.0.0}:443:443"
      - "${CRM_HTTP_BIND:-0.0.0.0}:443:443/udp"
    depends_on:
      crm-web: {condition: service_healthy}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  crm-web:
    # Reached over the compose network by Caddy, so it publishes nothing itself.
    ports: !reset []
