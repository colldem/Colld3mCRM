name: crm

x-crm-env: &crm-env
  DB_HOST: crm-db
  DB_NAME: crm
  DB_USER: crm
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Nustatykite POSTGRES_PASSWORD}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Nustatykite DJANGO_SECRET_KEY}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-crm,localhost,127.0.0.1}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  DJANGO_DEBUG: "false"
  DJANGO_FORCE_HTTPS: ${DJANGO_FORCE_HTTPS:-false}
  DJANGO_SESSION_IDLE_MINUTES: ${DJANGO_SESSION_IDLE_MINUTES:-480}
  CRM_BASE_URL: ${CRM_BASE_URL:-}
  # Encryption key for integration secrets entered in the Settings UI (G5/G6/G7).
  CRM_SECRETS_KEY: ${CRM_SECRETS_KEY:-}
  # Email / IMAP / Entra below are an optional fallback — the Settings UI is the
  # primary place to configure them.
  # Email notifications (G7)
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
  # Incoming mail (G6)
  IMAP_HOST: ${IMAP_HOST:-}
  IMAP_PORT: ${IMAP_PORT:-993}
  IMAP_USER: ${IMAP_USER:-}
  IMAP_PASSWORD: ${IMAP_PASSWORD:-}
  IMAP_FOLDER: ${IMAP_FOLDER:-INBOX}
  # Microsoft Entra ID login (G5)
  OIDC_ENABLED: ${OIDC_ENABLED:-false}
  OIDC_RP_CLIENT_ID: ${OIDC_RP_CLIENT_ID:-}
  OIDC_RP_CLIENT_SECRET: ${OIDC_RP_CLIENT_SECRET:-}
  OIDC_TENANT_ID: ${OIDC_TENANT_ID:-}
  OIDC_CREATE_USERS: ${OIDC_CREATE_USERS:-false}

services:
  crm-db:
    image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Nustatykite POSTGRES_PASSWORD}
    volumes: ["./runtime/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  crm-backup:
    image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      DB_HOST: crm-db
      DB_NAME: crm
      DB_USER: crm
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Nustatykite POSTGRES_PASSWORD}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./runtime/backups:/backups
      - ./runtime/media:/media:ro
    depends_on:
      crm-db: {condition: service_healthy}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  crm-tailscale:
    image: tailscale/tailscale:v1.102.2@sha256:321ce041508c19079b57a28b6666c8d81ab0b08accc0a2585b3ab663d557ac24
    hostname: ${TS_HOSTNAME:-crm}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    volumes:
      - ./runtime/tailscale-state:/var/lib/tailscale
      - ./deploy/tailscale:/config:ro
    ports: ["${CRM_BIND_IP:-127.0.0.1}:${CRM_LAN_PORT:-18081}:8080"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  crm-web:
    image: crm-web:0.46.0
    build: .
    environment:
      <<: *crm-env
      CRM_SETUP_TOKEN: ${CRM_SETUP_TOKEN:-}
    volumes:
      - ./runtime/media:/app/runtime/media
    network_mode: service:crm-tailscale
    depends_on:
      crm-db: {condition: service_healthy}
      crm-tailscale: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  crm-worker:
    image: crm-web:0.46.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "while true; do python manage.py extend_recurrences || true; python manage.py send_notifications || true; python manage.py fetch_mail || true; sleep ${WORKER_INTERVAL_SECONDS:-300}; done"
    environment:
      <<: *crm-env
    volumes:
      - ./runtime/media:/app/runtime/media
    depends_on:
      crm-db: {condition: service_healthy}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
