name: crm-staging

# Overlay: a second, isolated copy of the CRM, holding a clone of production data
# so changes can be tried against realistic records before they are released.
#
# In the staging directory's .env:
#   COMPOSE_FILE=compose.yaml:compose.tailscale.yaml:compose.staging.yaml
#   CRM_ENVIRONMENT=staging
# (swap compose.tailscale.yaml for compose.caddy.yaml, or drop it entirely, to
# match however you expose the main instance.)
#
# What makes it safe to hold real personal data:
#   * CRM_ENVIRONMENT=staging — contacts/integrations.py returns an inert config
#     for SMTP, IMAP and Entra, and contacts/webhooks.py refuses to queue or post,
#     whatever the restored database says.
#   * No background jobs: crm-worker and crm-backup are scaled to zero below, so
#     nothing acts on the cloned data on a timer. Do not undo this.
#
# scripts/refresh-staging.sh reloads the data from production on demand.

services:
  crm-web:
    image: crm-web:staging
  # Not "removed" — compose cannot delete an inherited service, so both are
  # defined with zero replicas, which starts none of them.
  crm-worker:
    image: crm-web:staging
    deploy:
      replicas: 0
  crm-backup:
    deploy:
      replicas: 0
