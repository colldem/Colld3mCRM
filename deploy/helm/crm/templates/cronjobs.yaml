{{- if .Values.worker.enabled }}
{{- range $name, $job := .Values.worker.jobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "crm.fullname" $ }}-{{ $name }}
  labels: {{- include "crm.labels" $ | nindent 4 }}
spec:
  schedule: {{ $job.schedule | quote }}
  # Forbid, because these commands claim work with database flags rather than a
  # lock: two overlapping runs would be doing the same work twice.
  concurrencyPolicy: {{ $.Values.worker.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ $.Values.worker.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $.Values.worker.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ $.Values.worker.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "crm.selectorLabels" $ | nindent 12 }}
            app.kubernetes.io/component: worker
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "crm.serviceAccountName" $ }}
          automountServiceAccountToken: {{ $.Values.automountServiceAccountToken }}
          {{- with $.Values.image.pullSecrets }}
          imagePullSecrets: {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext: {{- toYaml $.Values.podSecurityContext | nindent 12 }}
          containers:
            - name: {{ $name }}
              image: {{ include "crm.image" $ }}
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
              securityContext: {{- toYaml $.Values.securityContext | nindent 16 }}
              command: ["python", "manage.py", {{ $job.command | quote }}]
              env: {{- include "crm.env" $ | nindent 16 }}
              envFrom: {{- include "crm.envFrom" $ | nindent 16 }}
              resources: {{- toYaml $.Values.workerResources | nindent 16 }}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: tmp
              emptyDir: {sizeLimit: {{ $.Values.tmpVolume.sizeLimit }}}
          {{- with $.Values.nodeSelector }}
          nodeSelector: {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- end }}
