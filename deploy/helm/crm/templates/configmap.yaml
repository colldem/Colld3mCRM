apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "crm.fullname" . }}-config
  labels: {{- include "crm.labels" . | nindent 4 }}
data:
  {{- /* Host-derived settings default to the ingress host so one value drives them all. */}}
  DJANGO_ALLOWED_HOSTS: {{ .Values.env.DJANGO_ALLOWED_HOSTS | default (include "crm.host" .) | quote }}
  DJANGO_CSRF_TRUSTED_ORIGINS: {{ .Values.env.DJANGO_CSRF_TRUSTED_ORIGINS | default (printf "https://%s" (include "crm.host" .)) | quote }}
  CRM_BASE_URL: {{ .Values.env.CRM_BASE_URL | default (printf "https://%s" (include "crm.host" .)) | quote }}
  {{- range $key, $value := .Values.env }}
  {{- if not (has $key (list "DJANGO_ALLOWED_HOSTS" "DJANGO_CSRF_TRUSTED_ORIGINS" "CRM_BASE_URL")) }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
