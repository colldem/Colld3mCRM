{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "crm.secretName" . }}
  labels: {{- include "crm.labels" . | nindent 4 }}
  annotations:
    # Helm would otherwise regenerate this on every upgrade; the CRM secrets key
    # in particular must survive, or stored integration passwords stop decrypting.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  DJANGO_SECRET_KEY: {{ required "Set secrets.djangoSecretKey or point existingSecret at your own Secret" .Values.secrets.djangoSecretKey | quote }}
  CRM_SECRETS_KEY: {{ required "Set secrets.crmSecretsKey — it decrypts stored integration passwords and must never change" .Values.secrets.crmSecretsKey | quote }}
  DB_PASSWORD: {{ .Values.secrets.databasePassword | quote }}
  CRM_S3_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | quote }}
  CRM_S3_SECRET_KEY: {{ .Values.secrets.s3SecretKey | quote }}
  {{- with .Values.secrets.setupToken }}
  CRM_SETUP_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
