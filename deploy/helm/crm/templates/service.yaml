apiVersion: v1
kind: Service
metadata:
  name: {{ include "crm.fullname" . }}
  labels: {{- include "crm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  # component: web — the CronJob and migration pods share the other labels and
  # must never receive traffic.
  selector:
    {{- include "crm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
