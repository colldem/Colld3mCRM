{% load i18n %}{% comment %}The two sign-in fields, labelled in the CRM's own words
rather than Django's defaults.{% endcomment %}
<label for="id_username">{% translate 'Prisijungimo vardas' %}</label>
<input id="id_username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false"
       autofocus required maxlength="150" value="{{ form.username.value|default:'' }}">
<label for="id_password">{% translate 'Slaptažodis' %}</label>
<input id="id_password" name="password" type="password" autocomplete="current-password" required>
