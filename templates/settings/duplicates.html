{% extends "settings/layout.html" %}{% load i18n %}
{% block settings_content %}
<div class="settings-section-head">
  <div><h2>{% translate 'Dublikatų tikrinimas' %}</h2><p>{% translate 'Valdykite galimų kontaktų ir įmonių dublikatų aptikimą.' %}</p></div>
</div>
<form method="post" class="profile-form duplicate-settings-form">
  {% csrf_token %}
  {{ form.non_field_errors }}
  <label class="setting-toggle">{{ form.enabled }} <span><strong>{{ form.enabled.label }}</strong><small>{% translate 'Kontaktai laikomi dublikatais, kai sutampa vardas ir pavardė, el. paštas arba telefonas. Įmonės — kai sutampa pavadinimas, el. paštas, telefonas, PVM kodas arba įmonės kodas. Kontaktas ir įmonė tarpusavyje nelyginami.' %}</small></span></label>
  <label class="setting-toggle">{{ form.check_on_edit }} <span><strong>{{ form.check_on_edit.label }}</strong></span></label>
  <label class="setting-toggle">{{ form.check_on_import }} <span><strong>{{ form.check_on_import.label }}</strong><small>{% translate 'Importas ir toliau atnaujina tiksliai sutampantį kontaktą.' %}</small></span></label>
  <div class="form-actions"><button class="btn primary" type="submit">{% translate 'Išsaugoti pakeitimus' %}</button><a class="btn" href="{% url 'contacts:duplicate-list' %}">{% translate 'Peržiūrėti dublikatus' %}</a></div>
</form>
{% endblock %}
