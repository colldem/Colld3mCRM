{% extends "settings/layout.html" %}{% load i18n %}
{% block settings_content %}
<div class="settings-section-head"><div><h2>{% translate 'Slaptažodžio keitimas' %}</h2><p>{% translate 'Įveskite dabartinį slaptažodį ir naują — ne trumpesnį nei 12 simbolių.' %}</p></div></div>
<form method="post" class="profile-form">{% csrf_token %}
  {{ form.non_field_errors }}
  <div class="password-fields">
    <label>{{ form.old_password.label }}{{ form.old_password }}{{ form.old_password.errors }}</label>
    <label>{{ form.new_password1.label }}{{ form.new_password1 }}<small>{% translate 'Bent 12 simbolių. Negali būti panašus į naudotojo vardą ar el. paštą, dažnai naudojamas arba vien iš skaičių.' %}</small>{{ form.new_password1.errors }}</label>
    <label>{{ form.new_password2.label }}{{ form.new_password2 }}{{ form.new_password2.errors }}</label>
  </div>
  <div class="form-actions profile-form-actions"><button class="btn primary" type="submit">{% translate 'Pakeisti slaptažodį' %}</button></div>
</form>
{% endblock %}
