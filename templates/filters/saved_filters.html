{% load i18n %}
<details class="drawer-control"><summary class="btn">{% translate 'Mano filtrai' %}</summary><div class="saved-filter-panel">
  {% for item in saved_filters %}
  <div class="saved-filter-row">
    <a class="saved-filter-apply" href="?{{ item.query_string }}">{% if item.is_default %}★ {% endif %}{{ item.name }}</a>
    <form method="post" action="{% url 'contacts:saved-filter-update' item.pk %}">{% csrf_token %}
      <input name="name" value="{{ item.name }}" required maxlength="100" aria-label="{% translate 'Filtro pavadinimas' %}">
      <button class="btn" name="action" value="rename" type="submit">{% translate 'Pervadinti' %}</button>
      <button class="btn" name="action" value="default" type="submit">{% if item.is_default %}{% translate 'Nebe numatytasis' %}{% else %}{% translate 'Numatytasis' %}{% endif %}</button>
      <button class="btn danger" name="action" value="delete" type="submit" aria-label="{% translate 'Pašalinti' %} {{ item.name }}">✕</button>
    </form>
  </div>
  {% empty %}<p>{% translate 'Išsaugotų filtrų nėra.' %}</p>
  {% endfor %}
  <form method="post" action="{% url create_url %}">{% csrf_token %}<input name="name" required maxlength="100" placeholder="{% translate 'Filtro pavadinimas' %}">{% include hidden_fields %}<button class="btn" type="submit">{% translate 'Išsaugoti dabartinį' %}</button></form>
</div></details>
