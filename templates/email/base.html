{% load i18n %}<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'lt' }}">
<body style="margin:0;padding:0;background:#f5f8fc;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f8fc;">
  <tr><td align="center" style="padding:24px 12px;">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px;max-width:600px;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;line-height:1.5;color:#111318;">
      <tr><td style="background:#062b63;color:#ffffff;padding:16px 24px;font-size:18px;font-weight:700;border-radius:8px 8px 0 0;">CRM</td></tr>
      <tr><td style="background:#ffffff;border:1px solid #d9e1ea;border-top:0;padding:24px;">
        {% block body %}{% endblock %}
      </td></tr>
      <tr><td style="padding:14px 24px 0;color:#667085;font-size:12px;line-height:1.5;">
        {% block footer %}<a href="{{ base_url }}" style="color:#667085;">{{ base_url }}</a>{% endblock %}
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
