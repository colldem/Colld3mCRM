{% load i18n %}
<div class="detail-title-editor" data-field="{% if person %}full_name{% else %}name{% endif %}">
  <div class="field-display" tabindex="0" role="group" aria-label="{% translate 'Dukart spustelėkite pavadinimą, kad redaguotumėte' %}">
    <h1 {% if person %}data-contact-name{% else %}data-company-name{% endif %}>{% if person %}{{ person }}{% else %}{{ company.name }}{% endif %}</h1>
  </div>
  <form class="field-editor title-field-editor" method="post" action="{% if person %}{% url 'contacts:field-edit' person.pk %}{% else %}{% url 'contacts:company-field-edit' company.pk %}{% endif %}" hidden>
    {% csrf_token %}
    {% if person %}
      <input type="hidden" name="field" value="full_name">
      <label for="title-first-name">{% translate 'Vardas' %}</label><input id="title-first-name" name="first_name" value="{{ person.first_name }}" required maxlength="100">
      <label for="title-last-name">{% translate 'Pavardė' %}</label><input id="title-last-name" name="last_name" value="{{ person.last_name }}" required maxlength="100">
    {% else %}
      <input type="hidden" name="field" value="name"><input type="hidden" name="render_title" value="1">
      <label for="title-company-name">{% translate 'Pavadinimas' %}</label><input id="title-company-name" name="value" value="{{ company.name }}" required maxlength="200">
    {% endif %}
    <div class="field-actions"><button class="btn primary" type="submit">{% translate 'Išsaugoti' %}</button><button class="btn cancel-field" type="button">{% translate 'Atšaukti' %}</button></div>
    <p role="status" aria-live="polite"></p>
  </form>
</div>
